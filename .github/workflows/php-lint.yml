name: PHP syntax checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP 8.2 syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done < <(git ls-files -z '*.php')
